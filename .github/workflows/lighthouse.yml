name: Lighthouse

# Performance budget on every pull request: a new animation or dependency that pushes
# LCP, blocking time, layout shift or the JS weight past the limits in lighthouserc.json fails the check.
on:
  pull_request:
    branches: ["main", "dev"]

permissions:
  contents: read

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build project (Vite)
        run: npm run build

      - name: Run Lighthouse CI
        run: npx @lhci/cli@0.14.0 autorun

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci/reports
          if-no-files-found: ignore
